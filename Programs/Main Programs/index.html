<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div>
        <link rel="stylesheet" type="text/css" href="./style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lalezar&display=swap" rel="stylesheet">
    </div>
    
    <title>Document</title>
</head>
<body>
    <header>
        <div class="logo">
            <p class="logo-text">
                <span class="green">Green</span>
                <span class="power">Power</span>
            </p>
        </div>
        <div class="navbar-header">
            <p class="nav-text">HOME</p>
            <p class="nav-text">PROGRAMS</p>
            <p class="nav-text">WORK TIME</p>
            <p class="nav-text">COUCHES</p>
            <p class="nav-text">ABOUT US</p>
        </div>
        <div class="sign-div">
            <div>
                <p class="sign-in-text">SIGN IN</p>
            </div>
            <div>
                <p class="sign-up-text">SIGN UP</p>
            </div>
        </div>
    </header> 
    <main>
        <section class="services-section">
            <h1 class="services-title">OUR SERVICES</h1>
            <div class="overlay-text">
                OUR SERVICES
            </div>
            <div class="services-container">
                <div class="service-card">
                    <div class="service-card-img">
                        <img src="./img/sauna.png" alt="Sauna">
                        <p class="service-text">SAUNA</p>
                        <div class="overlay-text-mini">
                            SAUNA
                        </div>
                    </div>
                </div>
                <div class="service-card">
                    <div class="service-card-img">
                        <img src="./img/training.png" alt="Personal Training">
                        <p class="service-text">PERSONAL TRAINING</p>
                        <div class="overlay-text-mini">
                            PERSONAL TRAINING
                        </div>
                    </div>
                </div>
                <div class="service-card">
                    <div class="service-card-img">
                        <img src="./img/group.png" alt="Group Training">
                        <p class="service-text">GROUP TRAINING</p>
                        <div class="overlay-text-mini">
                            GROUP TRAINING
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
    </main>
    <footer>

    </footer>
</body>
</html>
